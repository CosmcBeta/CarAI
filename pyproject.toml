[project]
name = "race-track"
version = "0.1.0"
description = "Simple race track procedurally and randomly made."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.7",
    "numpy>=2.3.4",
    "pygame>=2.6.1",
    "scipy>=1.16.2",
    "scipy-stubs>=1.16.2.4",
]

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pre-commit>=4.3.0",
    "ruff>=0.14.1",
]
